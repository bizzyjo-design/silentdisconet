<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silent Disconet</title>
    <style>
        body { margin:0; background:#000; color:#fff; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; user-select:none; }
        .lang-switch { position:absolute; top:15px; right:15px; display:flex; gap:10px; }
        .lang-btn { background:#222; border:1px solid #444; color:#fff; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold; }
        .lang-btn.active { border-color:#00FF00; background:#111; }
        #status-text { font-size:1.5rem; margin-bottom:1rem; text-align:center; font-weight:bold; padding:0 20px; }
        .setup-container { display:flex; flex-direction:column; align-items:center; gap:15px; width:100%; max-width:300px; }
        input { width:100%; padding:0.8rem; border-radius:25px; border:2px solid #333; background:#111; color:#fff; font-size:1rem; text-align:center; box-sizing:border-box; }
        .btn { background:#00FF00; color:#000; border:none; padding:1.2rem 3rem; font-size:1.3rem; font-weight:bold; border-radius:50px; cursor:pointer; width:100%; }
        .alarm { background:#FF0033 !important; }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button id="btn-nl" class="lang-btn active" onclick="wisselTaal('nl')">NL 🇳🇱</button>
        <button id="btn-en" class="lang-btn" onclick="wisselTaal('en')">EN 🇬🇧</button>
    </div>

    <div id="status-text">Vul je naam in om te starten:</div>

    <div class="setup-container" id="setup-area">
        <input type="text" id="naam-input" placeholder="Jouw Naam">
        <button id="main-btn" class="btn" onclick="startSpel()">START</button>
    </div>

    <script>
        let huidigeTaal = 'nl';
        let mijnNaam = "";
        let startX = 0, startY = 0, startZ = 0;
        let sessieActief = false;

        const vertalingen = {
            nl: { start: "Vul je naam in om te starten:", placeholder: "Jouw Naam", btn: "START", aftellen: "Sessie start over 3 seconden... LEG NEER!", actief: "🔒 Ssshh... Niet aanraken!", alarm: "🚨 JIJ BENT AFGEGAAN! 🚨" },
            en: { start: "Enter your name to start:", placeholder: "Your Name", btn: "START", aftellen: "Session starts in 3 seconds... PLACE DOWN!", actief: "🔒 Ssshh... Do not touch!", alarm: "🚨 YOU MOVED! 🚨" }
        };

        function wisselTaal(taal) {
            huidigeTaal = taal;
            document.getElementById('btn-nl').classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-' + taal).classList.add('active');
            document.getElementById('status-text').innerText = vertalingen[taal].start;
            document.getElementById('naam-input').placeholder = vertalingen[taal].placeholder;
            document.getElementById('main-btn').innerText = vertalingen[taal].btn;
        }

        async function startSpel() {
            mijnNaam = document.getElementById('naam-input').value.trim();
            if (!mijnNaam) { alert(huidigeTaal === 'nl' ? "Vul je naam in!" : "Enter your name!"); return; }

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
            }

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('status-text').innerText = vertalingen[huidigeTaal].aftellen;

            setTimeout(() => {
                document.getElementById('status-text').innerText = vertalingen[huidigeTaal].actief;
                sessieActief = true;
                window.addEventListener('devicemotion', checkBeweging);
            }, 3000);
        }

        function checkBeweging(event) {
            if (!sessieActief) return;
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            if (startX === 0 && startY === 0 && startZ === 0) {
                startX = acc.x; startY = acc.y; startZ = acc.z; return;
            }

            if (Math.abs(acc.x - startX) > 1.8 || Math.abs(acc.y - startY) > 1.8) {
                sessieActief = false;
                window.removeEventListener('devicemotion', checkBeweging);
                document.body.classList.add('alarm');
                document.getElementById('status-text').innerText = vertalingen[huidigeTaal].alarm;

                // De WhatsApp-straftruc: opent direct je WhatsApp met de juiste tekst klaar!
                const tekst = encodeURIComponent(`🚨 ${mijnNaam.toUpperCase()} HEEFT DE TELEFOON BEWOGEN! En betaalt de volgende ronde drankjes! 🍻`);
                window.location.href = `https://wa.me{tekst}`;
            }
        }
    </script>
</body>
</html>
