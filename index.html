
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Silent Disco V5.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050505;color:#fff}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;align-items:flex-start;padding:28px 0;user-select:none;transition:background .15s}
.app{width:100%;max-width:440px;padding:24px;text-align:center}
.lang{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.lang button{background:#171717;border:1px solid #444;color:#fff;padding:8px 11px;border-radius:10px;font-weight:800}
.lang button.active{border-color:#00ff66}
.logo{font-size:2rem;font-weight:950;letter-spacing:2px;margin-top:24px}.subtitle{color:#888;margin:7px 0 26px}
section{display:none}.show{display:block}
h1{font-size:1.4rem;margin:0 0 18px}
.stack{display:flex;flex-direction:column;gap:12px}
input,select,textarea{width:100%;padding:14px 16px;border-radius:18px;border:2px solid #303030;background:#111;color:#fff;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#00ff66}
textarea{min-height:88px;resize:vertical}
label{display:block;text-align:left;font-weight:800;margin:6px 4px 5px}
.btn{width:100%;border:0;border-radius:28px;padding:16px 18px;background:#00ff66;color:#000;font-weight:950;font-size:1rem;cursor:pointer}
.btn.secondary{background:#181818;color:#fff;border:1px solid #333}
.small{color:#888;font-size:.82rem;line-height:1.45;margin-top:12px}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.mode{border:2px solid #2c2c2c;background:#101010;color:#fff;border-radius:17px;padding:14px;text-align:left;cursor:pointer}
.mode.selected{border-color:#00ff66}
.mode strong{display:block;font-size:1.04rem}.mode span{display:block;color:#888;font-size:.82rem;margin-top:3px}
.players{margin:16px 0;text-align:left}.player{background:#111;border:1px solid #242424;padding:11px 14px;margin-bottom:8px;border-radius:13px}
.panel{background:#0d0d0d;border:1px solid #242424;border-radius:18px;padding:15px;margin:14px 0;text-align:left}
.panel .row{display:flex;justify-content:space-between;gap:10px;margin:7px 0}.panel .muted{color:#888}
#countdown{font-size:8rem;font-weight:950;padding-top:40px}.silence,.alarm-icon,.win-icon{font-size:5rem}.active-title{font-size:2rem;font-weight:950;margin-top:8px}.active-subtitle{color:#999;margin-top:10px}
.timer{font-size:2.2rem;font-weight:950;margin-top:20px}
body.alarm{background:#ff0033}.loser{font-size:2.35rem;font-weight:950;text-transform:uppercase;margin:14px 0}
.result-big{font-size:2rem;font-weight:950;margin:10px 0}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="lang"><button id="nl" class="active">NL 🇳🇱</button><button id="en">EN 🇬🇧</button></div>
<main class="app">
<div class="logo">SILENT DISCO</div><div class="subtitle">Phone-Free Challenge</div>

<section id="home" class="show">
<h1 id="homeTitle"></h1>
<button id="newGame" class="btn"></button>
<div id="homeHelp" class="small"></div>
</section>

<section id="setupName">
<h1 id="creatorTitle"></h1>
<div class="stack">
<input id="creatorName" maxlength="20">
<button id="toSetup" class="btn"></button>
</div>
</section>

<section id="setup">
<h1 id="setupTitle"></h1>
<div class="stack">
<label id="modeLabel"></label>
<div class="cards" id="modeCards">
<button class="mode selected" data-mode="party"><strong>🎉 Party</strong><span id="partyDesc"></span></button>
<button class="mode" data-mode="classroom"><strong>🎓 Classroom</strong><span id="classDesc"></span></button>
<button class="mode" data-mode="meeting"><strong>💼 Meeting</strong><span id="meetingDesc"></span></button>
</div>

<label id="timeLabel"></label>
<select id="duration">
<option value="1">1 min</option>
<option value="5">5 min</option>
<option value="15" selected>15 min</option>
<option value="30">30 min</option>
<option value="60">60 min</option>
</select>

<label id="penaltyLabel"></label>
<select id="penaltyType">
<option value="random"></option>
<option value="custom"></option>
</select>
<textarea id="customPenalty" class="hidden" maxlength="120"></textarea>

<button id="create" class="btn"></button>
</div>
</section>

<section id="join">
<h1 id="joinTitle"></h1>
<div class="stack">
<input id="joinName" maxlength="20">
<button id="joinGame" class="btn"></button>
</div>
<div id="joinHelp" class="small"></div>
</section>

<section id="lobby">
<h1 id="lobbyTitle"></h1>
<div id="settingsPanel" class="panel"></div>
<div id="players" class="players"></div>
<div id="invite" class="panel hidden">
<button id="share" class="btn"></button>
<div id="shareHelp" class="small"></div>
</div>
<button id="start" class="btn hidden"></button>
<div id="guestWait" class="small"></div>
</section>

<section id="countdown">3</section>

<section id="active">
<div class="silence">🤫</div>
<div id="activeTitle" class="active-title"></div>
<div id="activeSub" class="active-subtitle"></div>
<div id="gameTimer" class="timer">00:00</div>
</section>

<section id="over">
<div class="alarm-icon">🚨</div>
<div id="alarmTitle"></div>
<div id="loser" class="loser"></div>
<div id="penalty" style="margin:14px 0 22px"></div>
<button id="reset" class="btn"></button>
</section>

<section id="success">
<div class="win-icon">🏆</div>
<div id="successTitle" class="result-big"></div>
<div id="successDetail"></div>
<div class="stack" style="margin-top:20px">
<button id="shareResult" class="btn"></button>
<button id="successReset" class="btn secondary"></button>
</div>
</section>
</main>

<script>
const NTFY="https://ntfy.sh", THRESHOLD=1.8, STORE="silentdisco_v5_state";
let language="nl", name="", room="", playerId="", creator=false, source=null, heartbeat=null, wakeLock=null;
let active=false,busy=false,gameEndAt=0,gameInterval=null,currentPenalty="",settings={mode:"party",duration:15,penaltyType:"random",customPenalty:""};
let px=null,py=null,pz=null,lastMove=0; const playerMap={};

const T={
nl:{
home:"Klaar om te spelen?",newGame:"NIEUW SPEL",homeHelp:"Eén organisator. Iedereen speelt gratis mee via de uitnodigingslink.",
creator:"Wie organiseert?",name:"Jouw naam",next:"GA VERDER",setup:"Kies je spel",mode:"Modus",partyDesc:"Feestje met grappige straffen",classDesc:"Telefoonvrij in de klas",meetingDesc:"Focus tijdens vergadering",time:"Tijd",penalty:"Straf / melding",random:"Willekeurig uit de lijst",custom:"Zelf invullen",customPh:"Typ je eigen straf of melding…",create:"MAAK SPEL",
joinTitle:"Je bent uitgenodigd!",join:"SPEEL MEE",joinHelp:"Vul alleen je naam in.",lobby:"Wachten op spelers...",share:"DEEL UITNODIGING",shareHelp:"Stuur de link via WhatsApp, sms, Messenger…",start:"START",guestWait:"Wacht tot de organisator start.",
active:"NIET BEWEGEN",activeSub:"Leg je telefoon plat neer. Raak hem niet aan.",you:"🚨 JIJ HEBT BEWOGEN! 🚨",other:"🚨 {name} HEEFT BEWOGEN! 🚨",reset:"NIEUWE RONDE",
success:"GEHAALD!",shareResult:"DEEL RESULTAAT",needName:"Vul je naam in.",needPenalty:"Vul je eigen straf of melding in.",motion:"Bewegingstoestemming is nodig om te spelen.",shareText:"Speel Silent Disco met mij!",copied:"Link gekopieerd!",resultCopied:"Resultaat gekopieerd!",
players:"spelers",minutes:"minuten telefoonvrij",modeNames:{party:"Party",classroom:"Classroom",meeting:"Meeting"}
},
en:{
home:"Ready to play?",newGame:"NEW GAME",homeHelp:"One host. Everyone else joins free through the invite link.",
creator:"Who is hosting?",name:"Your name",next:"CONTINUE",setup:"Choose your game",mode:"Mode",partyDesc:"Party mode with fun penalties",classDesc:"Phone-free classroom challenge",meetingDesc:"Stay focused during meetings",time:"Time",penalty:"Penalty / message",random:"Random from the list",custom:"Write your own",customPh:"Type your own penalty or message…",create:"CREATE GAME",
joinTitle:"You're invited!",join:"JOIN GAME",joinHelp:"Just enter your name.",lobby:"Waiting for players...",share:"SHARE INVITE",shareHelp:"Send the link via WhatsApp, text, Messenger…",start:"START",guestWait:"Wait for the host to start.",
active:"DO NOT MOVE",activeSub:"Place your phone flat. Do not touch it.",you:"🚨 YOU MOVED! 🚨",other:"🚨 {name} MOVED! 🚨",reset:"NEW ROUND",
success:"YOU DID IT!",shareResult:"SHARE RESULT",needName:"Enter your name.",needPenalty:"Enter your own penalty or message.",motion:"Motion permission is required to play.",shareText:"Play Silent Disco with me!",copied:"Link copied!",resultCopied:"Result copied!",
players:"players",minutes:"minutes phone-free",modeNames:{party:"Party",classroom:"Classroom",meeting:"Meeting"}
}
};

const PENALTIES={
party:{
nl:["trakteert de volgende ronde! 🍻","moet 30 seconden dansen zonder muziek 💃","moet de groep een compliment geven 😄","doet de volgende opdracht die de groep kiest 🎲"],
en:["buys the next round! 🍻","has to dance for 30 seconds with no music 💃","must give the group a compliment 😄","does the next challenge chosen by the group 🎲"]
},
classroom:{
nl:["werd betrapt met de telefoon 📱","heeft de telefoonvrije challenge verloren","moet de telefoon weer neerleggen en opnieuw focussen"],
en:["was caught using the phone 📱","lost the phone-free challenge","must put the phone down and refocus"]
},
meeting:{
nl:["werd betrapt met de telefoon tijdens de meeting 📱","verbreekt de telefoonvrije focus","mag de volgende koffie halen ☕"],
en:["was caught using the phone during the meeting 📱","broke the phone-free focus","gets the next coffee ☕"]
}
};

const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll("main section").forEach(s=>s.classList.remove("show"));$(id).classList.add("show")}
function saveState(){localStorage.setItem(STORE,JSON.stringify({room,name,playerId,creator,settings}))}
function clearState(){localStorage.removeItem(STORE)}
function paint(){
const t=T[language];
$("nl").classList.toggle("active",language==="nl");$("en").classList.toggle("active",language==="en");
$("homeTitle").textContent=t.home;$("newGame").textContent=t.newGame;$("homeHelp").textContent=t.homeHelp;
$("creatorTitle").textContent=t.creator;$("creatorName").placeholder=t.name;$("toSetup").textContent=t.next;
$("setupTitle").textContent=t.setup;$("modeLabel").textContent=t.mode;$("partyDesc").textContent=t.partyDesc;$("classDesc").textContent=t.classDesc;$("meetingDesc").textContent=t.meetingDesc;
$("timeLabel").textContent=t.time;$("penaltyLabel").textContent=t.penalty;$("penaltyType").options[0].text=t.random;$("penaltyType").options[1].text=t.custom;$("customPenalty").placeholder=t.customPh;$("create").textContent=t.create;
$("joinTitle").textContent=t.joinTitle;$("joinName").placeholder=t.name;$("joinGame").textContent=t.join;$("joinHelp").textContent=t.joinHelp;
$("lobbyTitle").textContent=t.lobby;$("share").textContent=t.share;$("shareHelp").textContent=t.shareHelp;$("start").textContent=t.start;$("guestWait").textContent=creator?"":t.guestWait;
$("activeTitle").textContent=t.active;$("activeSub").textContent=t.activeSub;$("reset").textContent=t.reset;$("shareResult").textContent=t.shareResult;$("successReset").textContent=t.reset;
drawSettings();draw();
}
$("nl").onclick=()=>{language="nl";paint()};$("en").onclick=()=>{language="en";paint()};
$("newGame").onclick=()=>show("setupName");
$("toSetup").onclick=()=>{name=$("creatorName").value.trim().slice(0,20);if(!name)return alert(T[language].needName);show("setup")};

document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{
document.querySelectorAll(".mode").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");settings.mode=b.dataset.mode;
}));
$("penaltyType").onchange=()=>{$("customPenalty").classList.toggle("hidden",$("penaltyType").value!=="custom")};

function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)}
function makeRoom(){const a=new Uint32Array(4);crypto.getRandomValues(a);return Array.from(a,n=>n.toString(36)).join("").slice(0,20)}

$("create").onclick=async()=>{
settings.duration=parseInt($("duration").value,10);
settings.penaltyType=$("penaltyType").value;
settings.customPenalty=$("customPenalty").value.trim().slice(0,120);
if(settings.penaltyType==="custom"&&!settings.customPenalty)return alert(T[language].needPenalty);
room=makeRoom();creator=true;playerId=uid();
if(await connect(true)){history.replaceState(null,"",location.pathname+"?room="+encodeURIComponent(room));saveState();$("invite").classList.remove("hidden");$("start").classList.remove("hidden");drawSettings()}
};

$("joinGame").onclick=async()=>{
name=$("joinName").value.trim().slice(0,20);if(!name)return alert(T[language].needName);
playerId=uid();creator=false;if(await connect(false)){saveState()}
};

async function motionOK(){
if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
try{return await DeviceMotionEvent.requestPermission()==="granted"}catch(e){return false}
}
return true
}
async function requestWake(){
try{
if("wakeLock" in navigator){if(wakeLock)try{await wakeLock.release()}catch(e){};wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}
}catch(e){console.warn("Wake lock unavailable",e)}
}
async function connect(isHost){
if(!(await motionOK())){alert(T[language].motion);return false}
listen();
add({id:playerId,name});
show("lobby");
await requestWake();
startHeartbeat();
if(isHost){$("invite").classList.remove("hidden");$("start").classList.remove("hidden")}
return true
}
function topic(){return "silentdisco_bizzy_"+encodeURIComponent(room)}
function listen(){
if(source)source.close();
source=new EventSource(NTFY+"/"+topic()+"/sse");

/* Belangrijk: we melden een speler pas bij de kamer aan zodra
   zijn realtime luisterverbinding echt OPEN is. Als de host de
   naam ziet, weten we dus dat die speler START kan ontvangen. */
source.onopen=()=>{
if(room&&playerId&&name)send({type:"player-join",id:playerId,name})
};

source.onmessage=e=>{
try{
const outer=JSON.parse(e.data);if(!outer.message)return;const m=JSON.parse(outer.message);
if(m.type==="player-join"||m.type==="player-heartbeat")add(m);
else if(m.type==="start-game"&&m.startAt){settings=m.settings||settings;currentPenalty=m.penalty||"";drawSettings();receiveStart(m.startAt,m.endAt)}
else if(m.type==="game-over"&&m.loserName)gameOver(m.loserName,m.penalty||currentPenalty);
else if(m.type==="game-success")gameSuccess(m.endAt||Date.now());
else if(m.type==="new-round")resetLocal();
}catch(err){console.warn(err)}
}
}
async function send(m){try{await fetch(NTFY+"/"+topic(),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(m)})}catch(e){console.error(e)}}
function startHeartbeat(){
clearInterval(heartbeat);
if(playerId&&name)add({id:playerId,name});
heartbeat=setInterval(()=>{
if(playerId&&name)add({id:playerId,name});
send({type:"player-heartbeat",id:playerId,name})
},5000)
}
function add(p){if(!p.id||!p.name)return;playerMap[p.id]={id:p.id,name:p.name,lastSeen:Date.now()};draw()}
function draw(){const box=$("players");box.innerHTML="";Object.values(playerMap).forEach(p=>{const d=document.createElement("div");d.className="player";d.textContent=p.name;box.appendChild(d)})}
function drawSettings(){
if(!room){$("settingsPanel").innerHTML="";return}
const t=T[language], mode=t.modeNames[settings.mode]||settings.mode;
const penaltyLabel=settings.penaltyType==="custom"?(settings.customPenalty||"—"):t.random;
$("settingsPanel").innerHTML=`<div class="row"><span class="muted">${t.mode}</span><strong>${mode}</strong></div><div class="row"><span class="muted">${t.time}</span><strong>${settings.duration} min</strong></div><div class="row"><span class="muted">${t.penalty}</span><strong>${escapeHtml(penaltyLabel)}</strong></div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

$("share").onclick=async()=>{
const url=location.origin+location.pathname+"?room="+encodeURIComponent(room),data={title:"Silent Disco",text:T[language].shareText,url};
try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);alert(T[language].copied)}}catch(e){}
};

function choosePenalty(){
if(settings.penaltyType==="custom")return settings.customPenalty;
const list=PENALTIES[settings.mode][language]||PENALTIES[settings.mode].nl;
return list[Math.floor(Math.random()*list.length)]
}
$("start").onclick=async()=>{
if(busy||!creator)return;
currentPenalty=choosePenalty();

/* Iets meer marge + twee herhalingen: mocht één netwerkbericht
   onderweg verloren gaan, gebruikt elk toestel exact dezelfde startAt. */
const startAt=Date.now()+5000,endAt=startAt+settings.duration*60000;
const msg={type:"start-game",startAt,endAt,settings,penalty:currentPenalty};
await send(msg);
setTimeout(()=>send(msg),700);
setTimeout(()=>send(msg),1400);
receiveStart(startAt,endAt)
};

function receiveStart(startAt,endAt){
if(busy)return;busy=true;active=false;gameEndAt=endAt;show("countdown");
const timer=setInterval(()=>{const left=startAt-Date.now();if(left<=0){clearInterval(timer);startActive();return}$("countdown").textContent=Math.max(1,Math.ceil(left/1000))},50)
}
function startActive(){
active=true;px=py=pz=null;show("active");requestWake();window.addEventListener("devicemotion",checkMove,true);
updateGameTimer();clearInterval(gameInterval);gameInterval=setInterval(updateGameTimer,250)
}
function updateGameTimer(){
const left=gameEndAt-Date.now();
if(left<=0){clearInterval(gameInterval);if(active&&creator){active=false;send({type:"game-success",endAt:gameEndAt});gameSuccess(gameEndAt)}return}
const total=Math.ceil(left/1000),m=Math.floor(total/60),s=total%60;$("gameTimer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")
}
function checkMove(e){
if(!active)return;const a=e.accelerationIncludingGravity;if(!a||a.x==null||a.y==null||a.z==null)return;
const x=a.x,y=a.y,z=a.z;if(px===null){px=x;py=y;pz=z;return}
const moved=Math.abs(x-px)>THRESHOLD||Math.abs(y-py)>THRESHOLD||Math.abs(z-pz)>THRESHOLD;
px=px*.9+x*.1;py=py*.9+y*.1;pz=pz*.9+z*.1;
if(!moved)return;const now=Date.now();if(now-lastMove<300)return;lastMove=now;ownMove()
}
function ownMove(){
if(!active)return;active=false;clearInterval(gameInterval);window.removeEventListener("devicemotion",checkMove,true);
send({type:"game-over",loserId:playerId,loserName:name,penalty:currentPenalty});gameOver(name,currentPenalty)
}
function gameOver(loserName,penaltyText){
active=false;busy=false;clearInterval(gameInterval);window.removeEventListener("devicemotion",checkMove,true);show("over");document.body.classList.add("alarm");
const t=T[language];$("alarmTitle").textContent=loserName.toLowerCase()===name.toLowerCase()?t.you:t.other.replace("{name}",loserName.toUpperCase());
$("loser").textContent=loserName.toUpperCase();$("penalty").textContent=loserName+" "+(penaltyText||currentPenalty)
}
function gameSuccess(){
active=false;busy=false;clearInterval(gameInterval);window.removeEventListener("devicemotion",checkMove,true);document.body.classList.remove("alarm");show("success");
const t=T[language],count=Object.keys(playerMap).length;$("successTitle").textContent=t.success;$("successDetail").textContent=count+" "+t.players+" • "+settings.duration+" "+t.minutes
}
$("reset").onclick=async()=>{if(creator)await send({type:"new-round"});resetLocal()};
$("successReset").onclick=async()=>{if(creator)await send({type:"new-round"});resetLocal()};
function resetLocal(){active=false;busy=false;clearInterval(gameInterval);window.removeEventListener("devicemotion",checkMove,true);document.body.classList.remove("alarm");show("lobby");if(creator){$("invite").classList.remove("hidden");$("start").classList.remove("hidden")}}

$("shareResult").onclick=async()=>{
const t=T[language],count=Object.keys(playerMap).length,text=`Silent Disco — ${t.success} ${count} ${t.players}, ${settings.duration} ${t.minutes}.`;
try{if(navigator.share)await navigator.share({title:"Silent Disco",text});else{await navigator.clipboard.writeText(text);alert(t.resultCopied)}}catch(e){}
};

setInterval(()=>{const now=Date.now();Object.keys(playerMap).forEach(k=>{if(now-playerMap[k].lastSeen>20000)delete playerMap[k]});draw()},5000);

document.addEventListener("visibilitychange",async()=>{
if(document.visibilityState==="visible"&&room&&name){
await requestWake();listen();await send({type:"player-heartbeat",id:playerId,name});startHeartbeat()
}
});
window.addEventListener("beforeunload",()=>{if(source)source.close();clearInterval(heartbeat);clearInterval(gameInterval);window.removeEventListener("devicemotion",checkMove,true)});

(function init(){
paint();
const q=new URLSearchParams(location.search),r=(q.get("room")||"").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,60);
let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||"null")}catch(e){}
if(!r){
show("home");
return;
}
if(saved&&saved.room===r&&saved.name){
room=r;name=saved.name;playerId=saved.playerId||uid();creator=!!saved.creator;settings=saved.settings||settings;
connect(creator).then(()=>{if(creator){$("invite").classList.remove("hidden");$("start").classList.remove("hidden")}drawSettings()});
}else{
room=r;creator=false;show("join");
}
})();
</script>
</body>
</html>
