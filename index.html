<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silent Disconet</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .lang-switch {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
        }
        .lang-btn {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .lang-btn.active {
            border-color: #00FF00;
            background: #111;
        }
        #status-text {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
            padding: 0 20px;
            white-space: pre-line;
        }
        #straf-text {
            font-size: 1.4rem;
            color: #ffcccc;
            text-align: center;
            margin-bottom: 2rem;
            padding: 0 30px;
            font-style: italic;
            display: none;
            font-weight: bold;
        }
        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border-radius: 25px;
            border: 2px solid #333;
            background-color: #111;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }
        .btn {
            background-color: #00FF00;
            color: #000000;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            width: 100%;
        }
        .alarm {
            background-color: #FF0033 !important;
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button id="btn-nl" class="lang-btn active" onclick="wisselTaal('nl')">NL 🇳🇱</button>
        <button id="btn-en" class="lang-btn" onclick="wisselTaal('en')">EN 🇬🇧</button>
    </div>

    <div id="status-text">Voer de namen in van de spelers:</div>
    <div id="straf-text"></div>

    <div class="setup-container" id="setup-area">
        <input type="text" id="namen-input" placeholder="bijv. Tom, Lisa, Sam">
        <button id="main-btn" class="btn" onclick="startSpel()">START GAME</button>
    </div>

    <script>
        let huidigeTaal = 'nl';
        let sessieActief = false;
        let startX = 0, startY = 0, startZ = 0;
        let spelersLijst = [];

        const vertalingen = {
            nl: {
                start: "Voer de namen in van de spelers (gescheiden door een komma):",
                placeholder: "bijv. Tom, Lisa, Sam",
                btn: "START GAME",
                alertFields: "Vul aub minstens één naam in!",
                aftellen: "Sessie start over 3 seconden...\nLEG DE TELEFOON MIDDEN OP TAFEL!",
                actief: "🔒 SSSHHH... De tafel is live!\nRaak de tafel of de telefoon NIET aan!",
                afgegaan: "🚨 ER IS BEWOGEN! 🚨",
                straf: "moet de volgende ronde drankjes betalen! 🍻"
            },
            en: {
                start: "Enter the names of the players (separated by a comma):",
                placeholder: "e.g. Tom, Lisa, Sam",
                btn: "START GAME",
                alertFields: "Please enter at least one name!",
                aftellen: "Session starts in 3 seconds...\nPLACE THE PHONE IN THE MIDDLE OF THE TABLE!",
                actief: "🔒 SSSHHH... The table is live!\nDO NOT touch the table or the phone!",
                afgegaan: "🚨 MOVEMENT DETECTED! 🚨",
                straf: "has to buy the next round of drinks! 🍻"
            }
        };

        function wisselTaal(taal) {
            huidigeTaal = taal;
            document.getElementById('btn-nl').classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-' + taal).classList.add('active');
            
            document.getElementById('status-text').innerText = vertalingen[taal].start;
            document.getElementById('namen-input').placeholder = vertalingen[taal].placeholder;
            document.getElementById('main-btn').innerText = vertalingen[taal].btn;
        }

        async function startSpel() {
            const input = document.getElementById('namen-input').value.trim();
            if (!input) {
                alert(vertalingen[huidigeTaal].alertFields);
                return;
            }

            spelersLijst = input.split(',').map(n => n.trim()).filter(n => n.length > 0);

            // iOS Sensor toestemming dwingen
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch (e) {}
            }

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('status-text').innerText = vertalingen[huidigeTaal].aftellen;

            setTimeout(() => {
                document.getElementById('status-text').innerText = vertalingen[huidigeTaal].actief;
                sessieActief = true;
                startX = 0; startY = 0; startZ = 0;
                window.addEventListener('devicemotion', checkBeweging);
            }, 3000);
        }

        function checkBeweging(event) {
            if (!sessieActief) return;
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            if (startX === 0 && startY === 0 && startZ === 0) {
                startX = acc.x; startY = acc.y; startZ = acc.z;
                return;
            }

            let diffX = Math.abs(acc.x - startX);
            let diffY = Math.abs(acc.y - startY);
            let diffZ = Math.abs(acc.z - startZ);

            if (diffX > 1.5 || diffY > 1.5 || diffZ > 1.5) {
                sessieActief = false;
                window.removeEventListener('devicemotion', checkBeweging);
                
                document.body.classList.add('alarm');
                document.getElementById('status-text').innerText = vertalingen[huidigeTaal].afgegaan;

                const verliezer = spelersLijst[Math.floor(Math.random() * spelersLijst.length)];
                
                const strafElement = document.getElementById('straf-text');
                strafElement.innerText = `${verliezer.toUpperCase()} ${vertalingen[huidigeTaal].straf}`;
                strafElement.style.display = 'block';

                document.getElementById('setup-area').style.display = 'flex';
                document.getElementById('namen-input').style.display = 'none';
                const btn = document.getElementById('main-btn');
                btn.innerText = huidigeTaal === 'nl' ? "VOLGENDE RONDE" : "NEXT ROUND";
                btn.onclick = () => window.location.reload();
            }
        }
    </script>
</body>
</html>
