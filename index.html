


<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Silent Disco Multiplayer V4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0}
body{background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;transition:background .15s}
.app{width:100%;max-width:430px;padding:24px;text-align:center}
.lang{position:fixed;top:15px;right:15px;display:flex;gap:8px}
.lang button{background:#171717;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:10px;font-weight:800}
.lang button.active{border-color:#00ff66;box-shadow:0 0 14px rgba(0,255,102,.25)}
.logo{font-size:2.1rem;font-weight:900;letter-spacing:2px}.subtitle{color:#888;margin:8px 0 28px}
section{display:none}.show{display:block}
h1{font-size:1.45rem;margin:0 0 18px}
.stack{display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:16px;border-radius:28px;border:2px solid #303030;background:#111;color:#fff;font-size:1rem;text-align:center;outline:none}
input:focus{border-color:#00ff66}
.btn{width:100%;border:0;border-radius:28px;padding:16px 18px;background:#00ff66;color:#000;font-weight:900;font-size:1rem;cursor:pointer;box-shadow:0 0 18px rgba(0,255,102,.25)}
.btn.secondary{background:#181818;color:#fff;border:1px solid #333;box-shadow:none}
.small{color:#777;font-size:.82rem;line-height:1.4;margin-top:14px}
.players{margin:18px 0;text-align:left}.player{background:#111;border:1px solid #222;padding:12px 15px;margin-bottom:8px;border-radius:13px}
#countdown{font-size:8rem;font-weight:900}.silence,.alarm-icon{font-size:5rem}.active-title{font-size:2rem;font-weight:900;margin-top:8px}.active-subtitle{color:#999;margin-top:12px}
body.alarm{background:#ff0033}.loser{font-size:2.5rem;font-weight:900;text-transform:uppercase;margin:15px 0}.invite{background:#0d0d0d;border:1px solid #242424;border-radius:18px;padding:16px;margin:15px 0}
</style>
</head>
<body>
<div class="lang"><button id="nl" class="active">NL 🇳🇱</button><button id="en">EN 🇬🇧</button></div>
<main class="app">
<div class="logo">SILENT DISCO</div><div class="subtitle">Multiplayer Party Game</div>

<section id="home" class="show">
<h1 id="homeTitle"></h1><div class="stack"><button id="newGame" class="btn"></button></div><div id="homeHelp" class="small"></div>
</section>

<section id="creator">
<h1 id="creatorTitle"></h1><div class="stack"><input id="creatorName" maxlength="20"><button id="create" class="btn"></button></div>
</section>

<section id="join">
<h1 id="joinTitle"></h1><div class="stack"><input id="joinName" maxlength="20"><button id="joinGame" class="btn"></button></div><div id="joinHelp" class="small"></div>
</section>

<section id="lobby">
<h1 id="lobbyTitle"></h1><div id="players" class="players"></div>
<div id="invite" class="invite" style="display:none"><button id="share" class="btn"></button><div id="shareHelp" class="small"></div></div>
<button id="start" class="btn"></button>
</section>

<section id="countdown">3</section>
<section id="active"><div class="silence">🤫</div><div id="activeTitle" class="active-title"></div><div id="activeSub" class="active-subtitle"></div></section>
<section id="over"><div class="alarm-icon">🚨</div><div id="alarmTitle"></div><div id="loser" class="loser"></div><div id="penalty" style="margin:15px 0 24px"></div><button id="reset" class="btn"></button></section>
</main>
<script>
const NTFY="https://ntfy.sh", THRESHOLD=1.8;
let language="nl",name="",room="",playerId="",creator=false,source=null,heartbeat=null,active=false,busy=false;
let px=null,py=null,pz=null,lastMove=0; const playerMap={};
const T={
nl:{home:"Klaar om te spelen?",newGame:"NIEUW SPEL",homeHelp:"Maak een spel en nodig je vrienden uit met één link.",creator:"Wie maakt het spel?",name:"Jouw naam",create:"GA VERDER",joinTitle:"Je bent uitgenodigd!",join:"SPEEL MEE",joinHelp:"Vul alleen je naam in.",lobby:"Wachten op spelers...",share:"DEEL UITNODIGING",shareHelp:"Stuur de uitnodiging via WhatsApp, sms, Messenger…",start:"START",active:"NIET BEWEGEN",activeSub:"Leg je telefoon plat neer. Raak hem niet aan.",you:"🚨 JIJ HEBT BEWOGEN! 🚨",other:"🚨 {name} HEEFT BEWOGEN! 🚨",penalty:"moet de volgende ronde drankjes betalen! 🍻",reset:"NIEUWE RONDE",needName:"Vul je naam in.",motion:"Bewegingstoestemming is nodig om te spelen.",shareText:"Speel Silent Disco met mij!",copied:"Uitnodigingslink gekopieerd!"},
en:{home:"Ready to play?",newGame:"NEW GAME",homeHelp:"Create a game and invite your friends with one link.",creator:"Who is creating the game?",name:"Your name",create:"CONTINUE",joinTitle:"You're invited!",join:"JOIN GAME",joinHelp:"Just enter your name.",lobby:"Waiting for players...",share:"SHARE INVITE",shareHelp:"Send the invite via WhatsApp, text, Messenger…",start:"START",active:"DO NOT MOVE",activeSub:"Place your phone flat. Do not touch it.",you:"🚨 YOU MOVED! 🚨",other:"🚨 {name} MOVED! 🚨",penalty:"has to buy the next round of drinks! 🍻",reset:"NEW ROUND",needName:"Enter your name.",motion:"Motion permission is required to play.",shareText:"Play Silent Disco with me!",copied:"Invite link copied!"}
};
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll("main section").forEach(s=>s.classList.remove("show"));$(id).classList.add("show")}
function paint(){const t=T[language];$("nl").classList.toggle("active",language==="nl");$("en").classList.toggle("active",language==="en");$("homeTitle").textContent=t.home;$("newGame").textContent=t.newGame;$("homeHelp").textContent=t.homeHelp;$("creatorTitle").textContent=t.creator;$("creatorName").placeholder=t.name;$("create").textContent=t.create;$("joinTitle").textContent=t.joinTitle;$("joinName").placeholder=t.name;$("joinGame").textContent=t.join;$("joinHelp").textContent=t.joinHelp;$("lobbyTitle").textContent=t.lobby;$("share").textContent=t.share;$("shareHelp").textContent=t.shareHelp;$("start").textContent=t.start;$("activeTitle").textContent=t.active;$("activeSub").textContent=t.activeSub;$("reset").textContent=t.reset;draw()}
$("nl").onclick=()=>{language="nl";paint()};$("en").onclick=()=>{language="en";paint()};
function uid(){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)}
function makeRoom(){const a=new Uint32Array(2);crypto.getRandomValues(a);return (a[0].toString(36)+a[1].toString(36)).slice(0,12)}
$("newGame").onclick=()=>show("creator");
$("create").onclick=async()=>{name=$("creatorName").value.trim().slice(0,20);if(!name)return alert(T[language].needName);room=makeRoom();creator=true;if(await connect()){history.replaceState(null,"",location.pathname+"?room="+encodeURIComponent(room));$("invite").style.display="block"}};
$("joinGame").onclick=async()=>{name=$("joinName").value.trim().slice(0,20);if(!name)return alert(T[language].needName);await connect()};
async function motionOK(){if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){try{return await DeviceMotionEvent.requestPermission()==="granted"}catch(e){return false}}return true}
async function connect(){playerId=uid();if(!(await motionOK())){alert(T[language].motion);return false}listen();add({id:playerId,name});show("lobby");await send({type:"player-join",id:playerId,name});clearInterval(heartbeat);heartbeat=setInterval(()=>send({type:"player-heartbeat",id:playerId,name}),5000);return true}
function topic(){return "silentdisco_bizzy_"+encodeURIComponent(room)}
function listen(){if(source)source.close();source=new EventSource(NTFY+"/"+topic()+"/sse");source.onmessage=e=>{try{const outer=JSON.parse(e.data);if(!outer.message)return;const m=JSON.parse(outer.message);if(m.type==="player-join"||m.type==="player-heartbeat")add(m);else if(m.type==="start-game"&&m.startAt)receiveStart(m.startAt);else if(m.type==="game-over"&&m.loserName)gameOver(m.loserName);else if(m.type==="new-round")resetLocal()}catch(err){console.warn(err)}}}
async function send(m){try{await fetch(NTFY+"/"+topic(),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(m)})}catch(e){console.error(e)}}
function add(p){if(!p.id||!p.name)return;playerMap[p.id]={id:p.id,name:p.name,lastSeen:Date.now()};draw()}
function draw(){const box=$("players");if(!box)return;box.innerHTML="";Object.values(playerMap).forEach(p=>{const d=document.createElement("div");d.className="player";d.textContent=p.name;box.appendChild(d)})}
$("share").onclick=async()=>{const url=location.origin+location.pathname+"?room="+encodeURIComponent(room);try{if(navigator.share)await navigator.share({title:"Silent Disco",text:T[language].shareText,url});else{await navigator.clipboard.writeText(url);alert(T[language].copied)}}catch(e){}};
$("start").onclick=async()=>{if(busy)return;const startAt=Date.now()+3500;await send({type:"start-game",startAt});receiveStart(startAt)};
function receiveStart(startAt){if(busy)return;busy=true;active=false;show("countdown");const timer=setInterval(()=>{const left=startAt-Date.now();if(left<=0){clearInterval(timer);startActive();return}$("countdown").textContent=Math.max(1,Math.ceil(left/1000))},50)}
function startActive(){active=true;px=py=pz=null;show("active");window.addEventListener("devicemotion",checkMove,true)}
function checkMove(e){if(!active)return;const a=e.accelerationIncludingGravity;if(!a||a.x==null||a.y==null||a.z==null)return;const x=a.x,y=a.y,z=a.z;if(px===null){px=x;py=y;pz=z;return}const moved=Math.abs(x-px)>THRESHOLD||Math.abs(y-py)>THRESHOLD||Math.abs(z-pz)>THRESHOLD;px=px*.9+x*.1;py=py*.9+y*.1;pz=pz*.9+z*.1;if(!moved)return;const now=Date.now();if(now-lastMove<300)return;lastMove=now;ownMove()}
function ownMove(){if(!active)return;active=false;window.removeEventListener("devicemotion",checkMove,true);send({type:"game-over",loserId:playerId,loserName:name});gameOver(name)}
function gameOver(loserName){active=false;busy=false;window.removeEventListener("devicemotion",checkMove,true);show("over");document.body.classList.add("alarm");const t=T[language];$("alarmTitle").textContent=loserName.toLowerCase()===name.toLowerCase()?t.you:t.other.replace("{name}",loserName.toUpperCase());$("loser").textContent=loserName.toUpperCase();$("penalty").textContent=loserName+" "+t.penalty}
$("reset").onclick=async()=>{await send({type:"new-round"});resetLocal()};
function resetLocal(){active=false;busy=false;window.removeEventListener("devicemotion",checkMove,true);document.body.classList.remove("alarm");show("lobby");if(creator)$("invite").style.display="block"}
setInterval(()=>{const now=Date.now();Object.keys(playerMap).forEach(k=>{if(now-playerMap[k].lastSeen>15000)delete playerMap[k]});draw()},5000);
window.addEventListener("beforeunload",()=>{if(source)source.close();clearInterval(heartbeat);window.removeEventListener("devicemotion",checkMove,true)});
(function(){paint();const q=new URLSearchParams(location.search),r=q.get("room");if(r){room=r.replace(/[^a-zA-Z0-9_-]/g,"").slice(0,40);if(room)show("join")}})();
</script>
</body>
</html>
