<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silent Disconet Multiplayer</title>
    <!-- We laden het ultra-stabiele PubNub netwerk voor de échte Wordfeud-verbinding -->
    <script src="https://pubnub.com"></script>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .lang-switch {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }
        .lang-btn {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .lang-btn.active {
            border-color: #00FF00;
            background: #111;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        #status-text {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
            padding: 0 20px;
            white-space: pre-line;
        }
        #straf-text {
            font-size: 1.4rem;
            color: #ffcccc;
            text-align: center;
            margin-bottom: 2rem;
            padding: 0 30px;
            font-style: italic;
            display: none;
            font-weight: bold;
        }
        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            z-index: 10;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border-radius: 25px;
            border: 2px solid #333;
            background-color: #111;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #00FF00;
        }
        .btn {
            background-color: #00FF00;
            color: #000000;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            width: 100%;
        }
        .alarm {
            background-color: #FF0033 !important;
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button id="btn-nl" class="lang-btn active" onclick="wisselTaal('nl')">NL 🇳🇱</button>
        <button id="btn-en" class="lang-btn" onclick="wisselTaal('en')">EN 🇬🇧</button>
    </div>

    <div id="status-text">Voer een kamer-code in om samen te spelen.</div>
    <div id="straf-text"></div>

    <div class="setup-container" id="setup-area">
        <input type="text" id="naam-input" placeholder="Jouw Naam">
        <input type="text" id="room-input" placeholder="Kamer Code (bijv. 1234)">
        <button id="main-btn" class="btn" onclick="verbindMetLobby()">VERBIND</button>
    </div>

    <script>
        let mijnNaam = "";
        let kamerCode = "";
        let sessieActief = false;
        let startX = 0, startY = 0, startZ = 0;
        const drempelwaarde = 1.8;
        let huidigeTaal = 'nl';
        let pubnub = null;

        const vertalingen = {
            nl: {
                start: "Voer een kamer-code in om samen te spelen.",
                namePlaceholder: "Jouw Naam",
                roomPlaceholder: "Kamer Code (bijv. 1234)",
                btnConnect: "VERBIND",
                btnStart: "START SESSIE VOOR IEDEREEN",
                alertFields: "Vul aub je naam en een kamer-code in!",
                connected: "Verbonden met kamer: {code}.\nLeg je telefoon neer en klik op START.",
                aftellen: "Sessie start over 3 seconden... LEG NEER!",
                actief: "🔒 Sessie is actief. NIET AANRAKEN!",
                alarmJij: "🚨 JIJ HEBT BEWOGEN! 🚨",
                alarmAnder: "🚨 {naam} HEEFT BEWOGEN! 🚨",
                btnReset: "RESET GAME",
                straf: "moet de volgende ronde drankjes betalen! 🍻"
            },
            en: {
                start: "Enter a room code to play together.",
                namePlaceholder: "Your Name",
                roomPlaceholder: "Room Code (e.g. 1234)",
                btnConnect: "CONNECT",
                btnStart: "START SESSION FOR EVERYONE",
                alertFields: "Please enter your name and a room code!",
                connected: "Connected to room: {code}.\nPlace your phone down and click START.",
                aftellen: "Session starts in 3 seconds... PLACE DOWN!",
                actief: "🔒 Session is active. DO NOT TOUCH!",
                alarmJij: "🚨 YOU MOVED! 🚨",
                alarmAnder: "🚨 {naam} MOVED! 🚨",
                btnReset: "RESET GAME",
                straf: "has to buy the next round of drinks! 🍻"
            }
        };

        function wisselTaal(taal) {
            huidigeTaal = taal;
            document.getElementById('btn-nl').classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-' + taal).classList.add('active');
            
            if (!sessieActief && !mijnNaam) {
                document.getElementById('status-text').innerText = vertalingen[taal].start;
                document.getElementById('naam-input').placeholder = vertalingen[taal].namePlaceholder;
                document.getElementById('room-input').placeholder = vertalingen[taal].roomPlaceholder;
                document.getElementById('main-btn').innerText = vertalingen[taal].btnConnect;
            }
        }

        async function vraagIoSToestemming() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch (e) {}
            }
        }

        async function verbindMetLobby() {
            // Als de speler al verbonden is, fungeert de knop als startknop
            if (mijnNaam && kamerCode) {
                activeerMultiplayerSessie();
                return;
            }

            mijnNaam = document.getElementById('naam-input').value.trim();
            kamerCode = document.getElementById('room-input').value.trim();

            if (!mijnNaam || !kamerCode) {
                alert(vertalingen[huidigeTaal].alertFields);
                return;
            }

            await vraagIoSToestemming();

            document.getElementById('naam-input').style.display = 'none';
            document.getElementById('room-input').style.display = 'none';
            
            // Toon de kamer-code rotsvast op het scherm
            document.getElementById('status-text').innerText = vertalingen[huidigeTaal].connected.replace('{code}', kamerCode);
            
            const btn = document.getElementById('main-btn');
            btn.innerText = vertalingen[huidigeTaal].btnStart;

            // Verbind direct met de stabiele PubNub server-lijn
            koppelLiveNetwerk();
        }

        function koppelLiveNetwerk() {
            pubnub = new PubNub({
                publishKey: 'pub-c-469b82fd-7b75-4089-a2a3-f0fa80721245',
                subscribeKey: 'sub-c-11ef84f6-86d1-447b-8774-70678ebef53d',
                userId: "user_" + Math.random().toString(36).substring(2, 9)
            });

            // Luister naar signalen van andere telefoons in dit kamernummer
            pubnub.addListener({
                message: function(event) {
                    const data = event.message;
                    if (data.action === 'start-game') {
                        lokaleSessieStarten();
                    } else if (data.action === 'game-over') {
                        iemandIsAfgegaan(data.verliezer);
                    }
                }
            });

            pubnub.subscribe({
                channels: ['silentdisco_room_' + kamerCode]
            });
        }

        function activeerMultiplayerSessie() {
            if (pubnub) {
                pubnub.publish({
                    channel: 'silentdisco_room_' + kamerCode,
                    message: { action: 'start-game' }
                });
            }
        }

        function lokaleSessieStarten() {
            if (sessieActief) return;
            document.getElementById('straf-text').style.display = 'none';
            document.getElementById('status-text').innerText = vertalingen[huidigeTaal].aftellen;
            document.getElementById('setup-area').style.display = 'none';

            setTimeout(() => {
                document.getElementById('status-text').innerText = vertalingen[huidigeTaal].actief;
                sessieActief = true;
                startX = 0; startY = 0; startZ = 0;
                window.addEventListener('devicemotion', checkBeweging);
            }, 3000);
        }

        function checkBeweging(event) {
            if (!sessieActief) return;
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            if (startX === 0 && startY === 0 && startZ === 0) {
                startX = acc.x; startY = acc.y; startZ = acc.z;return;}let diffX = Math.abs(acc.x - startX);let diffY = Math.abs(acc.y - startY);let diffZ = Math.abs(acc.z - startZ);if (diffX > drempelwaarde || diffY > drempelwaarde || diffZ > drempelwaarde) {sessieActief = false;window.removeEventListener('devicemotion', checkBeweging);// Meld direct over internet aan de andere telefoon dat jij af bent gegaan!if (pubnub) {pubnub.publish({channel: 'silentdisco_room_' + kamerCode,message: { action: 'game-over', verliezer: mijnNaam }});}}}function iemandIsAfgegaan(naamVerliezer) {sessieActief = false;window.removeEventListener('devicemotion', checkBeweging);document.body.classList.add('alarm');if (naamVerliezer === mijnNaam) {document.getElementById('status-text').innerText = vertalingen[huidigeTaal].alarmJij;} else {document.getElementById('status-text').innerText = vertalingen[huidigeTaal].alarmAnder.replace('{naam}', naamVerliezer.toUpperCase());}const strafElement = document.getElementById('straf-text');strafElement.innerText = naamVerliezer + " " + vertalingen[huidigeTaal].straf;strafElement.style.display = 'block';document.getElementById('setup-area').style.display = 'flex';const btn = document.getElementById('main-btn');btn.innerText = vertalingen[huidigeTaal].btnReset;btn.onclick = () => window.location.reload();}
