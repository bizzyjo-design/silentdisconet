
<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Silent Disco V9</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#050506;
  --panel:#0d0f12;
  --panel2:#13161a;
  --line:#242830;
  --muted:#8f98a6;
  --text:#f8fafc;
  --green:#00f56a;
  --green2:#43ff9a;
  --danger:#ff174d;
  --radius:24px;
}
html,body{margin:0;min-height:100%;background:
 radial-gradient(circle at 50% -10%,rgba(0,245,106,.14),transparent 34%),
 radial-gradient(circle at 100% 20%,rgba(0,245,106,.06),transparent 28%),
 var(--bg);color:var(--text)}
body{
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 display:flex;justify-content:center;align-items:flex-start;
 min-height:100svh;padding:28px 0 44px;user-select:none;transition:background .2s ease,color .2s ease;
 overflow-x:hidden
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
 background-image:
 linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
 linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
 background-size:28px 28px;
 mask-image:linear-gradient(to bottom,black,transparent 72%)
}
.app{width:100%;max-width:470px;padding:26px 22px;text-align:center;position:relative;z-index:1}
.lang{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:20}
.lang button{
 background:rgba(18,20,24,.86);backdrop-filter:blur(10px);
 border:1px solid #343943;color:#fff;padding:9px 12px;border-radius:13px;font-weight:900;
 box-shadow:0 8px 24px rgba(0,0,0,.22)
}
.lang button.active{border-color:var(--green);box-shadow:0 0 0 1px rgba(0,245,106,.16) inset,0 0 20px rgba(0,245,106,.08)}
.logo{
 font-size:clamp(2rem,7vw,2.65rem);font-weight:1000;letter-spacing:2.8px;margin-top:34px;
 line-height:1;background:linear-gradient(180deg,#fff 0%,#d9dee5 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent;position:relative
}
.logo:before{
 content:"";display:block;width:58px;height:6px;border-radius:999px;margin:0 auto 16px;
 background:linear-gradient(90deg,var(--green),var(--green2));
 box-shadow:0 0 26px rgba(0,245,106,.55)
}
.subtitle{
 color:var(--muted);margin:9px 0 30px;font-size:.92rem;letter-spacing:.18em;text-transform:uppercase
}
section{display:none;animation:fadeUp .28s ease}.show{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:1.48rem;margin:0 0 20px;letter-spacing:-.025em}
.stack{display:flex;flex-direction:column;gap:12px}
input,select,textarea{
 width:100%;padding:15px 17px;border-radius:18px;border:1px solid #2a2f37;
 background:linear-gradient(180deg,#111419,#0d0f12);color:#fff;font-size:16px;outline:none;
 box-shadow:0 10px 28px rgba(0,0,0,.16);transition:.18s ease
}
input:focus,select:focus,textarea:focus{
 border-color:var(--green);box-shadow:0 0 0 3px rgba(0,245,106,.09),0 12px 30px rgba(0,0,0,.2)
}
textarea{min-height:92px;resize:vertical}
label{display:block;text-align:left;font-weight:900;margin:8px 5px 5px;font-size:.88rem;color:#d9dee5}
.btn{
 width:100%;border:0;border-radius:999px;padding:17px 20px;
 background:linear-gradient(135deg,var(--green),var(--green2));color:#021006;
 font-weight:1000;font-size:1rem;letter-spacing:.025em;cursor:pointer;
 box-shadow:0 13px 34px rgba(0,245,106,.16),0 1px 0 rgba(255,255,255,.32) inset;
 transition:transform .12s ease,filter .12s ease,box-shadow .12s ease
}
.btn:active{transform:scale(.985)} .btn:hover{filter:brightness(1.035)}
.btn.secondary{
 background:linear-gradient(180deg,#181b20,#111318);color:#fff;border:1px solid #30353e;
 box-shadow:0 12px 28px rgba(0,0,0,.18)
}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.4)}
.small{color:var(--muted);font-size:.84rem;line-height:1.5;margin-top:12px}
.cards{display:grid;grid-template-columns:1fr;gap:11px}
.mode{
 border:1px solid #2b3038;background:linear-gradient(180deg,#111419,#0c0f12);
 color:#fff;border-radius:20px;padding:16px 17px;text-align:left;cursor:pointer;
 position:relative;overflow:hidden;transition:.16s ease;box-shadow:0 10px 24px rgba(0,0,0,.14)
}
.mode:after{
 content:"";position:absolute;right:16px;top:50%;width:10px;height:10px;border-radius:50%;
 background:#343941;transform:translateY(-50%);box-shadow:0 0 0 5px rgba(255,255,255,.018)
}
.mode.selected{border-color:var(--green);background:linear-gradient(180deg,rgba(0,245,106,.105),rgba(0,245,106,.028))}
.mode.selected:after{background:var(--green);box-shadow:0 0 18px rgba(0,245,106,.7)}
.mode strong{display:block;font-size:1.06rem}.mode span{display:block;color:var(--muted);font-size:.83rem;margin-top:4px;max-width:84%}
.players{margin:17px 0;text-align:left;display:flex;flex-direction:column;gap:9px}
.player{
 background:linear-gradient(180deg,#111419,#0d0f12);border:1px solid #252a31;padding:13px 15px;
 border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.13);position:relative;padding-left:42px
}
.player:before{
 content:"";position:absolute;left:15px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;
 background:var(--green);box-shadow:0 0 12px rgba(0,245,106,.55)
}
.panel{
 background:linear-gradient(180deg,rgba(18,21,25,.96),rgba(11,13,16,.96));
 border:1px solid #282d35;border-radius:22px;padding:17px;margin:15px 0;text-align:left;
 box-shadow:0 14px 34px rgba(0,0,0,.18);backdrop-filter:blur(12px)
}
.panel .row{display:flex;justify-content:space-between;gap:10px;margin:8px 0;align-items:center}
.panel .muted{color:var(--muted)}
#countdown{
 font-size:clamp(7rem,30vw,10rem);font-weight:1000;padding-top:42px;line-height:1;
 color:#fff;text-shadow:0 0 34px rgba(0,245,106,.42);
 animation:pulseCount .7s ease-in-out infinite alternate
}
@keyframes pulseCount{to{transform:scale(1.045);text-shadow:0 0 58px rgba(0,245,106,.66)}}
.silence,.alarm-icon,.win-icon{font-size:5.4rem;filter:drop-shadow(0 12px 25px rgba(0,0,0,.28))}
.active-title{font-size:2.25rem;font-weight:1000;margin-top:12px;letter-spacing:.02em}
.active-title:after{
 content:"";display:block;width:76px;height:5px;border-radius:999px;background:var(--green);
 margin:14px auto 0;box-shadow:0 0 20px rgba(0,245,106,.5)
}
.active-subtitle{color:var(--muted);margin-top:14px;line-height:1.5}
.timer{
 font-variant-numeric:tabular-nums;font-size:2.65rem;font-weight:1000;margin:26px auto 0;
 width:max-content;padding:12px 22px;border-radius:18px;background:#0c0f12;border:1px solid #242a31;
 box-shadow:0 12px 30px rgba(0,0,0,.18);letter-spacing:.03em
}
body.alarm{
 background:
 radial-gradient(circle at 50% 15%,rgba(255,255,255,.13),transparent 28%),
 linear-gradient(180deg,#ff174d,#b8002e);
 animation:alarmPulse .45s ease-in-out infinite alternate
}
@keyframes alarmPulse{to{filter:brightness(1.12)}}
body.alarm:before{opacity:.1}
.loser{font-size:clamp(2.2rem,9vw,3.1rem);font-weight:1000;text-transform:uppercase;margin:16px 0;letter-spacing:.02em}
.result-big{font-size:2.2rem;font-weight:1000;margin:12px 0}
#over .btn,#success .btn{margin-top:8px}
.hidden{display:none!important}
#errorBox{
 background:rgba(255,23,77,.12);color:#ffc3d1;border:1px solid rgba(255,23,77,.42);
 border-radius:16px;padding:13px 14px;margin:12px 0;text-align:left;display:none
}
#home,#setupName,#setup,#join,#lobby,#active,#over,#success{
 padding:20px 0 8px;
}
#home .btn{margin-top:4px}
#lobby h1:before{
 content:"LIVE";display:inline-block;margin-right:8px;padding:4px 8px;border-radius:999px;
 font-size:.62rem;vertical-align:middle;letter-spacing:.12em;background:rgba(0,245,106,.1);
 color:var(--green);border:1px solid rgba(0,245,106,.35)
}
@media (max-width:560px){
 body{padding-top:20px}.app{padding:22px 18px}.lang{top:10px;right:10px}
 .logo{margin-top:48px}.subtitle{margin-bottom:26px}
}

</style>
</head>
<body>
<div class="lang"><button id="nl" class="active">NL 🇳🇱</button><button id="en">EN 🇬🇧</button></div>
<main class="app">
<div class="logo">SILENT DISCO</div><div class="subtitle">Phone-Free Challenge</div>
<div id="errorBox"></div>

<section id="home" class="show">
<h1 id="homeTitle"></h1><button id="newGame" class="btn"></button><div id="homeHelp" class="small"></div>
</section>

<section id="setupName"><h1 id="creatorTitle"></h1><div class="stack"><input id="creatorName" maxlength="20"><button id="toSetup" class="btn"></button></div></section>

<section id="setup"><h1 id="setupTitle"></h1><div class="stack">
<label id="modeLabel"></label>
<div class="cards">
<button class="mode selected" data-mode="party"><strong>🎉 Party</strong><span id="partyDesc"></span></button>
<button class="mode" data-mode="classroom"><strong>🎓 Classroom</strong><span id="classDesc"></span></button>
<button class="mode" data-mode="meeting"><strong>💼 Meeting</strong><span id="meetingDesc"></span></button>
</div>
<label id="timeLabel"></label><select id="duration"><option value="1">1 min</option><option value="5">5 min</option><option value="15" selected>15 min</option><option value="30">30 min</option><option value="60">60 min</option></select>
<label id="penaltyLabel"></label><select id="penaltyType"><option value="random"></option><option value="custom"></option></select>
<textarea id="customPenalty" class="hidden" maxlength="120"></textarea>
<button id="create" class="btn"></button></div></section>

<section id="join"><h1 id="joinTitle"></h1><div class="stack"><input id="joinName" maxlength="20"><button id="joinGame" class="btn"></button></div><div id="joinHelp" class="small"></div></section>

<section id="lobby"><h1 id="lobbyTitle"></h1><div id="settingsPanel" class="panel"></div><div id="players" class="players"></div>
<div id="invite" class="panel hidden"><button id="share" class="btn"></button><div id="shareHelp" class="small"></div></div>
<button id="start" class="btn hidden"></button><div id="guestWait" class="small"></div></section>

<section id="countdown">3</section>
<section id="active"><div class="silence">🤫</div><div id="activeTitle" class="active-title"></div><div id="activeSub" class="active-subtitle"></div><div id="gameTimer" class="timer">00:00</div></section>
<section id="over"><div class="alarm-icon">🚨</div><div id="alarmTitle"></div><div id="loser" class="loser"></div><div id="penalty" style="margin:14px 0 22px"></div><button id="reset" class="btn"></button></section>
<section id="success"><div class="win-icon">🏆</div><div id="successTitle" class="result-big"></div><div id="successDetail"></div><div class="stack" style="margin-top:20px"><button id="shareResult" class="btn"></button><button id="successReset" class="btn secondary"></button></div></section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
import { getDatabase, ref, set, update, get, onValue, onDisconnect, remove, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyB0cYb4an3B0dhF0XGBKWHs08FStmVORKw",
  authDomain:"silentdisconet.firebaseapp.com",
  databaseURL:"https://silentdisconet-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"silentdisconet",
  storageBucket:"silentdisconet.firebasestorage.app",
  messagingSenderId:"431513667902",
  appId:"1:431513667902:web:a8131d2285a9715fdbc46f"
};
const app=initializeApp(firebaseConfig), db=getDatabase(app);
const APP_URL="https://bizzyjo-design.github.io/silentdisconet/";
const THRESHOLD=1.8, STORE="silentdisco_v8_state";
let language="nl",name="",room="",playerId="",creator=false,wakeLock=null,unsubscribeRoom=null,disconnectOp=null;
let active=false,busy=false,gameEndAt=0,gameInterval=null,countdownInterval=null,currentPenalty={nl:"",en:""},settings={mode:"party",duration:15,penaltyType:"random",customPenalty:""};
let px=null,py=null,pz=null,lastMove=0,lastRoundId="",roomData=null;

const T={
nl:{home:"Klaar om te spelen?",newGame:"NIEUW SPEL",homeHelp:"Eén organisator. Iedereen speelt gratis mee via de uitnodigingslink.",creator:"Wie organiseert?",name:"Jouw naam",next:"GA VERDER",setup:"Kies je spel",mode:"Modus",partyDesc:"Feestje met grappige straffen",classDesc:"Telefoonvrij in de klas",meetingDesc:"Focus tijdens vergadering",time:"Tijd",penalty:"Straf / melding",random:"Willekeurig uit de lijst",custom:"Zelf invullen",customPh:"Typ je eigen straf of melding…",create:"MAAK SPEL",joinTitle:"Je bent uitgenodigd!",join:"SPEEL MEE",joinHelp:"Vul alleen je naam in.",lobby:"Wachten op spelers...",share:"DEEL UITNODIGING",shareHelp:"Stuur de link via WhatsApp, sms, Messenger…",start:"START",guestWait:"Wacht tot de organisator start.",active:"NIET BEWEGEN",activeSub:"Leg je telefoon plat neer. Raak hem niet aan.",you:"🚨 JIJ HEBT BEWOGEN! 🚨",other:"🚨 {name} HEEFT BEWOGEN! 🚨",reset:"NIEUWE RONDE",success:"GEHAALD!",shareResult:"DEEL RESULTAAT",needName:"Vul je naam in.",needPenalty:"Vul je eigen straf of melding in.",motion:"Bewegingstoestemming is nodig om te spelen.",shareText:"Speel Silent Disco met mij!",copied:"Link gekopieerd!",resultCopied:"Resultaat gekopieerd!",roomMissing:"Deze uitnodiging is niet meer actief.",connection:"Geen verbinding met de spelserver. Probeer opnieuw.",players:"spelers",minutes:"minuten telefoonvrij",modeNames:{party:"Party",classroom:"Classroom",meeting:"Meeting"}},
en:{home:"Ready to play?",newGame:"NEW GAME",homeHelp:"One host. Everyone else joins free through the invite link.",creator:"Who is hosting?",name:"Your name",next:"CONTINUE",setup:"Choose your game",mode:"Mode",partyDesc:"Party mode with fun penalties",classDesc:"Phone-free classroom challenge",meetingDesc:"Stay focused during meetings",time:"Time",penalty:"Penalty / message",random:"Random from the list",custom:"Write your own",customPh:"Type your own penalty or message…",create:"CREATE GAME",joinTitle:"You're invited!",join:"JOIN GAME",joinHelp:"Just enter your name.",lobby:"Waiting for players...",share:"SHARE INVITE",shareHelp:"Send the link via WhatsApp, text, Messenger…",start:"START",guestWait:"Wait for the host to start.",active:"DO NOT MOVE",activeSub:"Place your phone flat. Do not touch it.",you:"🚨 YOU MOVED! 🚨",other:"🚨 {name} MOVED! 🚨",reset:"NEW ROUND",success:"YOU DID IT!",shareResult:"SHARE RESULT",needName:"Enter your name.",needPenalty:"Enter your own penalty or message.",motion:"Motion permission is required to play.",shareText:"Play Silent Disco with me!",copied:"Link copied!",resultCopied:"Result copied!",roomMissing:"This invitation is no longer active.",connection:"No connection to the game server. Try again.",players:"players",minutes:"minutes phone-free",modeNames:{party:"Party",classroom:"Classroom",meeting:"Meeting"}}
};
const PENALTIES={
party:{nl:["trakteert de volgende ronde! 🍻","moet 30 seconden dansen zonder muziek 💃","moet de groep een compliment geven 😄","doet de volgende opdracht die de groep kiest 🎲"],en:["buys the next round! 🍻","has to dance for 30 seconds with no music 💃","must give the group a compliment 😄","does the next challenge chosen by the group 🎲"]},
classroom:{nl:["werd betrapt met de telefoon 📱","heeft de telefoonvrije challenge verloren","moet de telefoon weer neerleggen en opnieuw focussen"],en:["was caught using the phone 📱","lost the phone-free challenge","must put the phone down and refocus"]},
meeting:{nl:["werd betrapt met de telefoon tijdens de meeting 📱","verbreekt de telefoonvrije focus","mag de volgende koffie halen ☕"],en:["was caught using the phone during the meeting 📱","broke the phone-free focus","gets the next coffee ☕"]}
};
const $=id=>document.getElementById(id);
const roomRef=()=>ref(db,`rooms/${room}`);
const playerRef=()=>ref(db,`rooms/${room}/players/${playerId}`);
const gameRef=()=>ref(db,`rooms/${room}/game`);
function show(id){document.querySelectorAll("main section").forEach(s=>s.classList.remove("show"));$(id).classList.add("show")}
function showError(msg){$("errorBox").textContent=msg;$("errorBox").style.display="block"}
function clearError(){$("errorBox").style.display="none";$("errorBox").textContent=""}
function saveState(){localStorage.setItem(STORE,JSON.stringify({room,name,playerId,creator,settings}))}
function clearState(){localStorage.removeItem(STORE)}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,12)}
function makeRoom(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,"0")).join("")}
function penaltyText(p=currentPenalty){return typeof p==="string"?p:(p?.[language]||p?.nl||p?.en||"")}
function paint(){
 const t=T[language];
 $("nl").classList.toggle("active",language==="nl");$("en").classList.toggle("active",language==="en");
 $("homeTitle").textContent=t.home;$("newGame").textContent=t.newGame;$("homeHelp").textContent=t.homeHelp;
 $("creatorTitle").textContent=t.creator;$("creatorName").placeholder=t.name;$("toSetup").textContent=t.next;
 $("setupTitle").textContent=t.setup;$("modeLabel").textContent=t.mode;$("partyDesc").textContent=t.partyDesc;$("classDesc").textContent=t.classDesc;$("meetingDesc").textContent=t.meetingDesc;
 $("timeLabel").textContent=t.time;$("penaltyLabel").textContent=t.penalty;$("penaltyType").options[0].text=t.random;$("penaltyType").options[1].text=t.custom;$("customPenalty").placeholder=t.customPh;$("create").textContent=t.create;
 $("joinTitle").textContent=t.joinTitle;$("joinName").placeholder=t.name;$("joinGame").textContent=t.join;$("joinHelp").textContent=t.joinHelp;
 $("lobbyTitle").textContent=t.lobby;$("share").textContent=t.share;$("shareHelp").textContent=t.shareHelp;$("start").textContent=t.start;$("guestWait").textContent=creator?"":t.guestWait;
 $("activeTitle").textContent=t.active;$("activeSub").textContent=t.activeSub;$("reset").textContent=t.reset;$("shareResult").textContent=t.shareResult;$("successReset").textContent=t.reset;
 drawSettings();drawPlayers();
 if($("over").classList.contains("show")&&roomData?.game?.loserName)renderGameOver(roomData.game);
}
$("nl").onclick=()=>{language="nl";paint()};$("en").onclick=()=>{language="en";paint()};
$("newGame").onclick=()=>show("setupName");
$("toSetup").onclick=()=>{name=$("creatorName").value.trim().slice(0,20);if(!name)return alert(T[language].needName);show("setup")};
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".mode").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");settings.mode=b.dataset.mode}));
$("penaltyType").onchange=()=>{$("customPenalty").classList.toggle("hidden",$("penaltyType").value!=="custom")};

async function motionOK(){
 if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function"){
   try{return await DeviceMotionEvent.requestPermission()==="granted"}catch{return false}
 }
 return true
}
async function requestWake(){
 try{
   if("wakeLock" in navigator){
     if(wakeLock)try{await wakeLock.release()}catch{}
     wakeLock=await navigator.wakeLock.request("screen");
     wakeLock.addEventListener("release",()=>{wakeLock=null});
   }
 }catch(e){console.warn("Wake lock unavailable",e)}
}
async function attachPresence(){
 const pRef=playerRef();
 try{
   disconnectOp=onDisconnect(pRef); await disconnectOp.remove();
   await set(pRef,{name,joinedAt:serverTimestamp()});
 }catch(e){console.error(e);throw e}
}
function listenRoom(){
 if(unsubscribeRoom)unsubscribeRoom();
 unsubscribeRoom=onValue(roomRef(),snap=>{
   roomData=snap.val();
   if(!roomData)return;
   if(roomData.settings){settings={...settings,...roomData.settings};drawSettings()}
   drawPlayers();
   handleGame(roomData.game||null);
 },err=>{console.error(err);showError(T[language].connection)});
}
async function connect(){
 clearError();
 if(!(await motionOK())){alert(T[language].motion);return false}
 show("lobby");drawSettings();await requestWake();listenRoom();
 try{await attachPresence();saveState();return true}
 catch(e){showError(T[language].connection);return false}
}
$("create").onclick=async()=>{
 settings.duration=parseInt($("duration").value,10);settings.penaltyType=$("penaltyType").value;settings.customPenalty=$("customPenalty").value.trim().slice(0,120);
 if(settings.penaltyType==="custom"&&!settings.customPenalty)return alert(T[language].needPenalty);
 room=makeRoom();creator=true;playerId=uid();
 history.replaceState(null,"",location.pathname+"?room="+encodeURIComponent(room));
 show("lobby");$("invite").classList.remove("hidden");$("start").classList.remove("hidden");drawSettings();
 try{
   await set(roomRef(),{meta:{hostId:playerId,createdAt:serverTimestamp()},settings,game:{status:"lobby",roundId:uid()},players:{}});
   if(!(await connect()))return;
 }catch(e){console.error(e);showError(T[language].connection)}
};
$("joinGame").onclick=async()=>{
 name=$("joinName").value.trim().slice(0,20);if(!name)return alert(T[language].needName);
 playerId=uid();creator=false;clearError();
 try{
   const snap=await get(roomRef());
   if(!snap.exists()){showError(T[language].roomMissing);return}
   const data=snap.val(); if(data.settings)settings={...settings,...data.settings};
   await connect();
 }catch(e){console.error(e);showError(T[language].connection)}
};
function drawSettings(){
 if(!room){$("settingsPanel").innerHTML="";return}
 const t=T[language],mode=t.modeNames[settings.mode]||settings.mode,penaltyLabel=settings.penaltyType==="custom"?(settings.customPenalty||"—"):t.random;
 $("settingsPanel").innerHTML=`<div class="row"><span class="muted">${t.mode}</span><strong>${escapeHtml(mode)}</strong></div><div class="row"><span class="muted">${t.time}</span><strong>${Number(settings.duration)||15} min</strong></div><div class="row"><span class="muted">${t.penalty}</span><strong>${escapeHtml(penaltyLabel)}</strong></div>`;
}
function drawPlayers(){
 const box=$("players");box.innerHTML="";
 const players=roomData?.players||{};
 Object.values(players).filter(p=>p?.name).forEach(p=>{const d=document.createElement("div");d.className="player";d.textContent=p.name;box.appendChild(d)});
}
$("share").onclick=async()=>{
 const url=APP_URL+"?room="+encodeURIComponent(room),data={title:"Silent Disco",text:T[language].shareText,url};
 try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);alert(T[language].copied)}}catch(e){}
};
function choosePenalty(){
 if(settings.penaltyType==="custom")return {nl:settings.customPenalty,en:settings.customPenalty};
 const nl=PENALTIES[settings.mode].nl,en=PENALTIES[settings.mode].en,i=Math.floor(Math.random()*nl.length);
 return {nl:nl[i],en:en[i]||nl[i]};
}
$("start").onclick=async()=>{
 if(busy||!creator)return;
 currentPenalty=choosePenalty();const startAt=Date.now()+4000,endAt=startAt+settings.duration*60000,roundId=uid();
 $("start").disabled=true;
 try{await set(gameRef(),{status:"countdown",roundId,startAt,endAt,penalty:currentPenalty,startedBy:playerId});}
 catch(e){$("start").disabled=false;showError(T[language].connection)}
};
function handleGame(g){
 if(!g||!g.roundId)return;
 currentPenalty=g.penalty||currentPenalty;
 if(g.status==="lobby"){if(lastRoundId!==g.roundId){lastRoundId=g.roundId;resetLocal(false)}return}
 if(g.status==="countdown"||g.status==="active"){
   if(lastRoundId!==g.roundId){lastRoundId=g.roundId;receiveStart(g.startAt,g.endAt)}
   return;
 }
 if(g.status==="over"){lastRoundId=g.roundId;renderGameOver(g);return}
 if(g.status==="success"){lastRoundId=g.roundId;gameSuccess();return}
}
function receiveStart(startAt,endAt){
 if(!startAt||!endAt)return;busy=true;active=false;gameEndAt=endAt;show("countdown");
 clearInterval(countdownInterval);
 const tick=()=>{const left=startAt-Date.now();if(left<=0){clearInterval(countdownInterval);startActive();return}$("countdown").textContent=Math.max(1,Math.ceil(left/1000))};
 tick();countdownInterval=setInterval(tick,50);
}
function startActive(){
 if(Date.now()>=gameEndAt){finishSuccessIfHost();return}
 active=true;px=py=pz=null;show("active");requestWake();window.removeEventListener("devicemotion",checkMove,true);window.addEventListener("devicemotion",checkMove,true);
 updateGameTimer();clearInterval(gameInterval);gameInterval=setInterval(updateGameTimer,250);
}
function updateGameTimer(){
 const left=gameEndAt-Date.now();
 if(left<=0){clearInterval(gameInterval);active=false;window.removeEventListener("devicemotion",checkMove,true);finishSuccessIfHost();return}
 const total=Math.ceil(left/1000),m=Math.floor(total/60),s=total%60;$("gameTimer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
async function finishSuccessIfHost(){
 if(!creator)return;
 try{await runTransaction(gameRef(),g=>g&&["countdown","active"].includes(g.status)?{...g,status:"success",finishedAt:Date.now()}:g)}
 catch(e){console.error(e)}
}
function checkMove(e){
 if(!active)return;const a=e.accelerationIncludingGravity;if(!a||a.x==null||a.y==null||a.z==null)return;
 const x=a.x,y=a.y,z=a.z;if(px===null){px=x;py=y;pz=z;return}
 const moved=Math.abs(x-px)>THRESHOLD||Math.abs(y-py)>THRESHOLD||Math.abs(z-pz)>THRESHOLD;
 px=px*.9+x*.1;py=py*.9+y*.1;pz=pz*.9+z*.1;
 if(!moved)return;const now=Date.now();if(now-lastMove<500)return;lastMove=now;ownMove();
}
async function ownMove(){
 if(!active)return;active=false;clearInterval(gameInterval);window.removeEventListener("devicemotion",checkMove,true);
 try{
   await runTransaction(gameRef(),g=>{
     if(!g||!["countdown","active"].includes(g.status))return g;
     return {...g,status:"over",loserId:playerId,loserName:name,penalty:g.penalty||currentPenalty,finishedAt:Date.now()};
   });
 }catch(e){console.error(e);showError(T[language].connection)}
}
function renderGameOver(g){
 active=false;busy=false;clearInterval(gameInterval);clearInterval(countdownInterval);window.removeEventListener("devicemotion",checkMove,true);show("over");document.body.classList.add("alarm");
 const loserName=g.loserName||"",t=T[language];$("alarmTitle").textContent=loserName.toLowerCase()===name.toLowerCase()?t.you:t.other.replace("{name}",loserName.toUpperCase());
 $("loser").textContent=loserName.toUpperCase();$("penalty").textContent=loserName+" "+penaltyText(g.penalty);
 $("start").disabled=false;
}
function gameSuccess(){
 active=false;busy=false;clearInterval(gameInterval);clearInterval(countdownInterval);window.removeEventListener("devicemotion",checkMove,true);document.body.classList.remove("alarm");show("success");
 const t=T[language],count=Object.keys(roomData?.players||{}).length;$("successTitle").textContent=t.success;$("successDetail").textContent=count+" "+t.players+" • "+settings.duration+" "+t.minutes;$("start").disabled=false;
}
$("reset").onclick=()=>newRound();
$("successReset").onclick=()=>newRound();
async function newRound(){
 if(creator){
   try{await set(gameRef(),{status:"lobby",roundId:uid(),resetAt:Date.now()})}catch(e){showError(T[language].connection)}
 }else resetLocal(false);
}
function resetLocal(showLobby=true){
 active=false;busy=false;clearInterval(gameInterval);clearInterval(countdownInterval);window.removeEventListener("devicemotion",checkMove,true);document.body.classList.remove("alarm");$("start").disabled=false;
 if(showLobby!==false||room)show("lobby");
 if(creator){$("invite").classList.remove("hidden");$("start").classList.remove("hidden")}else{$("invite").classList.add("hidden");$("start").classList.add("hidden")}
}
$("shareResult").onclick=async()=>{
 const t=T[language],count=Object.keys(roomData?.players||{}).length,text=`Silent Disco — ${t.success} ${count} ${t.players}, ${settings.duration} ${t.minutes}.`;
 try{if(navigator.share)await navigator.share({title:"Silent Disco",text});else{await navigator.clipboard.writeText(text);alert(t.resultCopied)}}catch(e){}
};
document.addEventListener("visibilitychange",async()=>{
 if(document.visibilityState==="visible"&&room&&name){await requestWake();try{await attachPresence()}catch(e){}}
});
window.addEventListener("beforeunload",()=>{clearInterval(gameInterval);clearInterval(countdownInterval);window.removeEventListener("devicemotion",checkMove,true);if(unsubscribeRoom)unsubscribeRoom()});

(async function init(){
 paint();
 const q=new URLSearchParams(location.search),r=(q.get("room")||"").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,80);
 let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||"null")}catch{}
 if(!r){show("home");return}
 room=r;
 if(saved&&saved.room===r&&saved.name){
   name=saved.name;playerId=saved.playerId||uid();creator=!!saved.creator;settings=saved.settings||settings;
   if(creator){$("invite").classList.remove("hidden");$("start").classList.remove("hidden")}
   await connect();drawSettings();
 }else{creator=false;show("join")}
})();
</script>
</body>
</html>
