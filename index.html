<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silent Disconet Party</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .lang-switch {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 9999;
        }
        .lang-btn {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .lang-btn.active {
            border-color: #00FF00;
            background: #111;
        }
        #status-text {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: bold;
            padding: 0 20px;
        }
        #straf-text {
            font-size: 1.4rem;
            color: #ffcccc;
            text-align: center;
            margin-bottom: 2rem;
            padding: 0 30px;
            font-style: italic;
            display: none;
            font-weight: bold;
        }
        .setup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border-radius: 25px;
            border: 2px solid #333;
            background-color: #111;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }
        .btn {
            background-color: #00FF00;
            color: #000000;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            width: 100%;
        }
        .alarm {
            background-color: #FF0033 !important;
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button id="btn-nl" class="lang-btn active" onclick="wisselTaal('nl')">NL 🇳🇱</button>
        <button id="btn-en" class="lang-btn" onclick="wisselTaal('en')">EN 🇬🇧</button>
    </div>

    <div id="status-text">Voer de namen in van de spelers:</div>
    <div id="straf-text"></div>

    <div class="setup-container" id="setup-area">
        <input type="text" id="namen-input" placeholder="bijv. Tom, Lisa, Sam">
        <button id="main-btn" class="btn" onclick="startSpel()">START GAME</button>
    </div>

    <script>
        let huidigeTaal = 'nl';
        let sessieActief = false;
        let startX = 0, startY = 0, startZ = 0;
        let spelers = [];

        const vertalingen = {
            nl: {
                start: "Voer de namen in van de spelers (gescheiden door komma):",
                placeholder: "bijv. Tom, Lisa, Sam",
                btn: "START GAME",
                aftellen: "Sessie start over 3 seconden... LEG OP TAFEL!",
                actief: "🔒 Spel is actief! Raak de tafel of telefoon NIET aan!",
                afgegaan: "🚨 ER IS BEWOGEN! 🚨",
                verliezer: "moet de volgende ronde drankjes betalen! 🍻"
            },
            en: {
                start: "Enter the names of the players (separated by comma):",
                placeholder: "e.g. Tom, Lisa, Sam",
                btn: "START GAME",
                aftellen: "Session starts in 3 seconds... PLACE ON TABLE!",
                actief: "🔒 Game is active! DO NOT touch the table or phone!",
                afgegaan: "🚨 MOVEMENT DETECTED! 🚨",
                verliezer: "has to buy the next round of drinks! 🍻"
            }
        };

        function wisselTaal(taal) {
            huidigeTaal = taal;
            document.getElementById('btn-nl').classList.remove('active');
            document.getElementById('btn-en').classList.remove('active');
            document.getElementById('btn-' + taal).classList.add('active');
            
            document.getElementById('status-text').innerText = vertalingen[taal].start;
            document.getElementById('namen-input').placeholder = vertalingen[taal].placeholder;
            document.getElementById('main-btn').innerText = vertalingen[taal].btn;
        }

        async function startSpel() {
            const input = document.getElementById('namen-input').value.trim();
            if (!input) {
                alert("Vul spelers in!");
                return;
            }
            spelers = input.split(',').map(n => n.trim());

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
            }

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('status-text').innerText = vertalingen[huidigeTaal].aftellen;

            setTimeout(() => {
                document.getElementById('status-text').innerText = vertalingen[huidigeTaal].actief;
                sessieActief = true;
                window.addEventListener('devicemotion', checkBeweging);
            }, 3000);
        }

        function checkBeweging(event) {
            if (!sessieActief) return;
            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            if (startX === 0 && startY === 0 && startZ === 0) {
                startX = acc.x; startY = acc.y; startZ = acc.z;
                return;
            }

            if (Math.abs(acc.x - startX) > 1.5 || Math.abs(acc.y - startY) > 1.5) {
                sessieActief = false;
                window.removeEventListener('devicemotion', checkBeweging);
                document.body.classList.add('alarm');
                
                const verliezer = spelers[Math.floor(Math.random() * spelers.length)];
                document.getElementById('status-text').innerText = vertalingen[huidigeTaal].afgegaan;
                document.getElementById('straf-text').innerText = verliezer + " " + vertalingen[huidigeTaal].verliezer;
                document.getElementById('straf-text').style.display = 'block';
            }
        }
    </script>
</body>
</html>
