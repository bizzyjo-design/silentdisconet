name: Apply DON’T TOUCH guest purchase CTA

on:
  push:
    paths:
      - '.github/workflows/apply-promo-cta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch live game
        run: python scripts/patch_donttouch_cta.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No diff to commit."
            exit 0
          fi
          git config user.name "Bizzyjo Automation"
          git config user.email "bizzyjo@gmail.com"
          git add index.html
          git commit -m "Add guest-to-host purchase CTA to DON’T TOUCH"
          git push
