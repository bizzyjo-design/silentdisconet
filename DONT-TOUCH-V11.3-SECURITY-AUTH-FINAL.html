<script type="module">
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
}
function likelyInAppBrowser(){
  const ua=navigator.userAgent||"";
  return /FBAN|FBAV|Instagram|Line\/|Messenger|WhatsApp/i.test(ua);
}
function showMotionGate(messageKey="motionExplain"){
  const t=T[language];
  $("motionGateTitle").textContent=t.motionTitle;
  $("motionGateText").textContent=t[messageKey]||t.motionExplain;
  $("motionGateAllow").textContent=t.motionAllow;
  $("motionGateHint").textContent=(isIOS()&&likelyInAppBrowser())?t.motionSafari:"";
  $("motionGate").style.display="flex";
}
function hideMotionGate(){ $("motionGate").style.display="none"; }

async function requestMotionAccess(){
  audio();
  if(motionGranted){hideMotionGate();return true;}
  if(typeof DeviceMotionEvent==="undefined"){
    showMotionGate("motionUnavailable");
    return false;
  }
  if(typeof DeviceMotionEvent.requestPermission==="function"){
    try{
      const permission=await DeviceMotionEvent.requestPermission();
      if(permission==="granted"){
        motionGranted=true;
        hideMotionGate();
        return true;
      }
      showMotionGate("motionDenied");
      return false;
    }catch(e){
      showMotionGate(likelyInAppBrowser()?"motionUnavailable":"motionDenied");
      return false;
    }
  }
  motionGranted=true;
  hideMotionGate();
  return true;
}

function audio(){

function tone(freq,duration=0.12,type="sine",gain=0.10,delay=0){
  const c=audio(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;

  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+duration+.03);
}

   if(lastRoundId!==g.roundId){lastRoundId=g.roundId;receiveStart(g.startAt,g.endAt)}

function gameSuccess(){
 winSound();
 active=false;busy=false;clearInterval(gameInterval);clearInterval(countdownInterval);window.removeEventListener("devicemotion",checkMove,true);document.body.classList.remove("alarm");show("success");
 const t=T[language],count=Object.keys(roomData?.players||{}).length;$("successTitle").textContent=t.success;$("successDetail").textContent=count+" "+t.players+" • "+settings.duration+" "+t.minutes;$("start").disabled=false;
}
$("reset").onclick=()=>newRound();
$("successReset").onclick=()=>newRound();
async function newRound(){
 if(creator){
   try{await set(gameRef(),{status:"lobby",roundId:uid(),resetAt:Date.now()})}catch(e){showError(T[language].connection)}
 }else resetLocal(false);
}
function resetLocal(showLobby=true){
 active=false;busy=false;clearInterval(gameInterval);clearInterval(countdownInterval);window.removeEventListener("devicemotion",checkMove,true);document.body.classList.remove("alarm");$("start").disabled=false;
 if(showLobby!==false||room)show("lobby");
 if(creator){$("invite").classList.remove("hidden");$("start").classList.remove("hidden")}else{$("invite").classList.add("hidden");$("start").classList.add("hidden")}
}
$("shareResult").onclick=async()=>{
 const t=T[language],count=Object.keys(roomData?.players||{}).length,text=`DON’T TOUCH — ${t.success} ${count} ${t.players}, ${settings.duration} ${t.minutes}.`;
 try{if(navigator.share)await navigator.share({title:"DON’T TOUCH",text});else{await navigator.clipboard.writeText(text);alert(t.resultCopied)}}catch(e){}
};
document.addEventListener("visibilitychange",async()=>{
 if(document.visibilityState==="visible"&&room&&name){await requestWake();try{await attachPresence()}catch(e){}}
});
window.addEventListener("beforeunload",()=>{clearInterval(gameInterval);clearInterval(countdownInterval);window.removeEventListener("devicemotion",checkMove,true);if(unsubscribeRoom)unsubscribeRoom()});

(async function init(){
 paint();
 const q=new URLSearchParams(location.search),r=(q.get("room")||"").replace(/[^a-zA-Z0-9_-]/g,"").slice(0,80);
 let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||"null")}catch{}
 if(!r){show("home");return}
 room=r;
 if(saved&&saved.room===r&&saved.name){
   name=saved.name;playerId=saved.playerId||uid();creator=!!saved.creator;settings=saved.settings||settings;
   if(creator){$("invite").classList.remove("hidden");$("start").classList.remove("hidden")}
   await connect();drawSettings();
 }else{creator=false;show("join")}
})();

$("motionGateAllow").onclick=async()=>{ await requestMotionAccess(); };
</script>

<div id="motionGate" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:24px">
  <div style="max-width:420px;width:100%;background:#17100b;border:1px solid rgba(255,170,70,.35);border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center">
    <div style="font-size:42px;margin-bottom:8px">📱</div>
    <h2 id="motionGateTitle" style="margin:0 0 10px"></h2>
    <p id="motionGateText" style="opacity:.86;line-height:1.45;margin:0 0 18px"></p>
    <button id="motionGateAllow" class="btn" style="width:100%;margin-bottom:10px"></button>
    <div id="motionGateHint" style="font-size:14px;opacity:.72;line-height:1.4"></div>
  </div>
</div>

</body>
</html>
